server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Docker's embedded DNS server.
  #
  # Without an explicit resolver, nginx resolves each upstream hostname once at
  # startup and caches that address for the life of the worker process. Recreate
  # the api container, which gets a new IP, and this one keeps proxying to a
  # container that no longer exists: every request 502s until nginx is itself
  # restarted. That turns an ordinary api redeploy into a frontend outage.
  #
  # Naming the upstream in a variable is what forces nginx to consult the
  # resolver per request rather than baking the address in at startup.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The SPA proxies the API through its own origin, so the browser stays on a
  # single origin. WebSocket upgrades and cookies then behave the same under
  # Docker as under `vite dev`, and CORS never enters the picture.
  location /api/ {
    set $api_upstream http://api:3000;
    # Required because a proxy_pass with a variable does not do the URI
    # rewriting that a trailing slash would normally provide.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location /socket.io/ {
    set $ws_upstream http://api:3000;
    proxy_pass $ws_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
