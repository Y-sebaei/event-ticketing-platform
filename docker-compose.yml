# One `docker compose up` brings up the entire platform: application services,
# Kafka, Elasticsearch, Postgres, and the full observability stack. There is no
# second setup step. Services declare healthchecks and ordered dependencies so
# the first run works from cold on a clean machine.
name: event-ticketing

x-node-app: &node-app
  build:
    context: .
    dockerfile: Dockerfile
  environment: &node-env
    NODE_ENV: production
    DATABASE_URL: postgres://app:app@postgres:5432/ticketing
    KAFKA_BROKERS: kafka:9092
    ELASTICSEARCH_URL: http://elasticsearch:9200
    INVENTORY_GRPC_URL: inventory:50051
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    OTEL_LOG_LEVEL: error
    # The v2 default partitioner is the one we want; this only silences the
    # migration notice kafkajs prints on every producer construction.
    KAFKAJS_NO_PARTITIONER_WARNING: '1'
    SMTP_HOST: mailpit
    SMTP_PORT: '1025'
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    LOCAL_PAYMENT_WEBHOOK_SECRET: ${LOCAL_PAYMENT_WEBHOOK_SECRET:-whsec_local_dev_secret}
    PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
    # Seats held while the customer pays. 15 minutes in production, matching the
    # payment session lifetime. CI compresses it so the expiry paths can be
    # tested in seconds instead of a quarter of an hour.
    CHECKOUT_HOLD_TTL_SECONDS: ${CHECKOUT_HOLD_TTL_SECONDS:-900}
    RESERVATION_SWEEP_INTERVAL_MS: ${RESERVATION_SWEEP_INTERVAL_MS:-15000}
    PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ticketing
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d ticketing']
      interval: 5s
      timeout: 3s
      retries: 20

  # The official Apache image rather than bitnami/kafka: Bitnami restricted
  # their public Docker Hub catalog in 2025 and the tag no longer resolves.
  # Upstream is one fewer vendor layer to reason about anyway.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      # KRaft mode: this single node is both broker and controller, so there is
      # no ZooKeeper container to explain or to wait for.
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # PLAINTEXT is how the services inside the network reach the broker;
      # EXTERNAL is how a process on the host does, which is what makes local
      # development without Docker possible.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      # Zero, so a consumer joining on a cold start is not held for the default
      # three seconds. It makes the first demo run noticeably quicker.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: '3'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Fixed rather than generated: the entrypoint formats the log directory on
      # first boot and refuses to start against data formatted with a different
      # id, so a generated one would break every restart that kept the volume.
      CLUSTER_ID: 'H2OtVH5M8T-L8XcpSSJEYg'
    ports: ['29092:29092']
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ['9200:9200']
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['8025:8025']
    environment:
      MP_MAX_MESSAGES: '500'

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./infra/otel/collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo/tempo.yaml']
    user: '0:0'
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempodata:/var/tempo
    ports: ['3200:3200']

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=exemplar-storage
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ['9090:9090']

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ['3001:3000']
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

  migrate:
    <<: *node-app
    # Runs as the owning `app` role; every other service connects with its own
    # least-privilege role (see infra/postgres/init.sql).
    command: ['node', 'db/migrate.mjs']
    restart: 'no'
    environment:
      <<: *node-env
      # One-shot container that runs before the collector is guaranteed up.
      OTEL_SDK_DISABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy

  inventory:
    <<: *node-app
    command: ['node', 'apps/inventory/dist/main.js']
    # Deliberately no published port: the inventory service speaks gRPC on the
    # internal network only and is not part of the public API surface.
    expose: ['50051']
    environment:
      <<: *node-env
      DATABASE_URL: postgres://svc_inventory:svc_inventory@postgres:5432/ticketing
      HEALTH_PORT: '3003'
      OTEL_SERVICE_NAME: inventory
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3003/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    <<: *node-app
    command: ['node', 'apps/api/dist/main.js']
    ports: ['3000:3000']
    environment:
      <<: *node-env
      DATABASE_URL: postgres://svc_api:svc_api@postgres:5432/ticketing
      OTEL_SERVICE_NAME: api
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      inventory:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/health/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  worker:
    <<: *node-app
    command: ['node', 'apps/worker/dist/main.js']
    ports: ['3002:3002']
    environment:
      <<: *node-env
      DATABASE_URL: postgres://svc_worker:svc_worker@postgres:5432/ticketing
      OTEL_SERVICE_NAME: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      inventory:
        condition: service_healthy

  # Runs once after the API is healthy, then exits. Berlin venues and events, so
  # the app is never empty on first run.
  seed:
    <<: *node-app
    command: ['node', 'scripts/seed.mjs']
    restart: 'no'
    environment:
      <<: *node-env
      API_URL: http://api:3000
      OTEL_SDK_DISABLED: 'true'
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ['5173:80']
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
  esdata:
  tempodata:
